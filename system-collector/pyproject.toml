[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poseidon-system-collector"
version = "0.1.0"
description = "Read-only Linux system information collector from Project Poseidon"
requires-python = ">=3.10"
license = {file = "../LICENSE"}

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
poseidon-system-collector = "poseidon_system_collector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
